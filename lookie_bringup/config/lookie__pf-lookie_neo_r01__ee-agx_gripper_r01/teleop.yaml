# lookie_teleop overrides for lookie__pf-lookie_neo_r01__ee-agx_gripper_r01 (loaded after common.yaml).
# differential chassis: headset drives waist pitch only; chassis is stick-only (vx, wz).
/**/lookie_teleop:
  ros__parameters:
    body_axes: [waist_pitch]

    # Parallel gripper: joint value is the opening width in m (0 closed, 0.1 fully open); main trigger 0 -> ee_open, 1 -> ee_close.
    ee_modules: [left_gripper_joint, right_gripper_joint]
    ee_feedback_groups: [left_gripper, right_gripper]   # kstone feedback groups whose loss only stops that gripper
    trigger_deadzone: 0.05
    ee_open: [0.1]
    ee_close: [0.0]
