# lookie_teleop overrides for lookie__pf-lookie_neo_r01__ee-agx_gripper_r01 (loaded after common.yaml).
# differential chassis: headset drives waist pitch (and the chassis in chassis mode); sticks drive vx, wz.
/**/lookie_teleop:
  ros__parameters:
    # Headset: height -> waist lift, lean -> waist pitch; in chassis mode (long press Y) its turn and forward walk
    # also -> chassis pose target (differential base: no sideways). The arm targets are in the base frame, so the arms cover the slow lift.
    body_axes: [chassis, waist_z, waist_pitch]
    lean_pivot_m: 0.27  # last waist pitch axis -> chest_link (URDF, neo 0.269 / trio 0.2705)
    # Sticks: use the chassis limits this model allows (kstone caps at 1.0 m/s / 2.0 rad/s); common.yaml stays
    # at the slower shared values so the Trio keeps its previous stick response.
    max_vx: 1.0
    max_wz: 2.0

    # Waist in joint space (kstone joint_targets torso_lift_joint / torso_pitch_joint, no torso_pose):
    # headset height (+ right stick in z mode) -> torso_joint1, lean -> torso_joint2.
    torso_joints: ["z:torso_joint1", "pitch:torso_joint2"]
    home_modules: [torso_lift_joint, torso_pitch_joint, left_arm_pose, right_arm_pose]
    waist_pitch_limits_deg: [-45.0, 90.0]
    joy_z_rate: 0.015
    waist_z_range: [-0.97, 0.4]

    # Parallel gripper: joint value is the opening width in m (0 closed, 0.1 fully open); main trigger 0 -> ee_open, 1 -> ee_close.
    # xyz is given in the rotated TCP frame (rotate by rpy, then offset along the rotated axes): the gripper tip
    # sits 5.5 cm ahead along the button-face plane and 3 cm along the panel normal
    controller_tcp: [0.055, 0.0, 0.03, 0.0, 0.5236, 0.0]   # right controller frame, left mirrored -> l/r_gripper_tip
    ee_modules: [left_gripper_joint, right_gripper_joint]
    ee_feedback_groups: [left_gripper, right_gripper]   # kstone feedback groups whose loss only stops that gripper
    trigger_deadzone: 0.05
    ee_open: [0.1]
    ee_close: [0.0]
