# Lookie neo with revo2std hands, differential chassis.
# Set urdf to the model file and package_dirs to its resource package directory.
model:
  file: ${urdf}
  package_dirs: ["${package_dirs}"]
  root: free_flyer
  mimic: coupled
  locked_joints: [left_wheel_joint, right_wheel_joint]  # chassis moves through the root, not the wheels
  joint_limits:
    position:
      lower:
        l_arm_joint4: 0.0873  # a fully stretched elbow can fold outward and get stuck
        r_arm_joint4: 0.0873
        l_arm_joint1: -2.007  # j1/j2/j3: measured convergence values
        r_arm_joint1: -0.921
        l_arm_joint2: 0.260
        r_arm_joint2: 0.260
        l_arm_joint3: -2.090
        r_arm_joint3: -0.649
        torso_joint2: -0.7854  # waist pitch: back at most 45° (driver/URDF keep ±1.55225)
      upper:
        l_arm_joint1: 0.921
        r_arm_joint1: 2.007
        l_arm_joint3: 0.649
        r_arm_joint3: 2.090
rate_hz: 50
feedback_timeout_s: 0.25
# One group per hardware module: each attaches on its own, so a lost module stops only itself
# (kstone_ros forwards only attached groups; lookie_teleop holds only the affected part).
# Ungrouped joints would form the group "default"; the free root is the group "base".
feedback_groups:
  - {name: torso, joints: ["torso_joint*"]}
  - {name: head, joints: ["head_joint*"]}
  - {name: left_arm, joints: ["l_arm_joint*"]}
  - {name: right_arm, joints: ["r_arm_joint*"]}
  - {name: left_hand, joints: [left_thumb_metacarpal_joint, left_thumb_proximal_joint, left_index_proximal_joint, left_middle_proximal_joint, left_ring_proximal_joint, left_pinky_proximal_joint]}
  - {name: right_hand, joints: [right_thumb_metacarpal_joint, right_thumb_proximal_joint, right_index_proximal_joint, right_middle_proximal_joint, right_ring_proximal_joint, right_pinky_proximal_joint]}
realtime: true
# Real-time thread for run(); failures only warn. Needs root, CAP_SYS_NICE/CAP_IPC_LOCK or rtprio/memlock limits.
thread:
  priority: 50        # 1-99 enables SCHED_FIFO, higher wins; 0 disables
  cpus: []            # empty: no pinning; logical CPU indices from 0, e.g. [2]
  lock_memory: false  # true locks the whole process in RAM (mlockall)
solver:
  mode: layered_independent
  damping: 0.001
robot:
  type: loopback
  initial:
    torso_joint1: 0.2
    torso_joint2: 0.0
    head_joint1: 0.0
    head_joint2: 0.0
    l_arm_joint1: 0.0
    l_arm_joint2: 1.57
    l_arm_joint3: -1.57
    l_arm_joint4: 1.57
    l_arm_joint5: 1.57
    l_arm_joint6: 0.0
    l_arm_joint7: 0.0
    r_arm_joint1: 0.0
    r_arm_joint2: 1.57
    r_arm_joint3: 1.57
    r_arm_joint4: 1.57
    r_arm_joint5: -1.57
    r_arm_joint6: 0.0
    r_arm_joint7: 0.0
modules:
  chassis:
    type: chassis
    chassis:
      command_timeout_s: 0.25
      kinematics: differential
      base_frame: chassis_base_link
      max_linear_velocity: 0.5  # real-robot cap, kept
      max_angular_velocity: 1.0
      max_linear_acceleration: 2.5
      max_linear_deceleration: 2.5
      max_angular_acceleration: 5.0
      max_angular_deceleration: 5.0
      position_tolerance: 0.001
      orientation_tolerance: 0.002
      target_position_deadband: 0.02
      target_orientation_deadband: 0.035
    # period_s: 0.02  # engine dt replaces it
  torso_pose:
    type: frame_target
    frame: chest_link
    joints: [torso_joint1, torso_joint2]
    reference: chassis_base_link
    weight: 1
    position_weight: [0, 0, 5]  # lift only moves z
    orientation_weight: [0, 1, 0]  # torso_joint2 pitches about world y
    world_axes: true
    lm_damping: 0.1
    position_tolerance: 0.001
    orientation_tolerance: 0.01
    task: {level: 0}
    # Home at about the lift's own speed (0.01 m/s) and the previous 0.5 rad/s pitch.
    home_motion: {velocity_scale: 0.6667, timeout_s: 2.0}
    trajectory:
      lead_speed_scale: 3.0
      # Matched to the lift (torso_joint1 ~0.01 m/s): a faster height ramp is chased by waist pitch instead.
      position: {velocity: 0.015, acceleration: 0.015, deceleration: 0.015, reversal_deceleration: 0.015, jerk: 0.15}
      # Teleop already rate-limits pitch to 0.8 rad/s.
      orientation: {velocity: 0.8, acceleration: 1.25, deceleration: 1.25, reversal_deceleration: 2.5, jerk: 12.5}
  left_arm_pose:
    type: frame_target
    frame: left_base_link  # no tool frame in this URDF
    joints: [l_arm_joint1, l_arm_joint2, l_arm_joint3, l_arm_joint4, l_arm_joint5, l_arm_joint6, l_arm_joint7]
    # joints: [torso_joint1, torso_joint2, l_arm_joint1, l_arm_joint2, l_arm_joint3, l_arm_joint4, l_arm_joint5, l_arm_joint6, l_arm_joint7]  # arms share the waist
    reference: chassis_base_link
    weight: 5
    orientation_weight: [0.2, 0.2, 0.2]
    lm_damping: 0.1
    task: {level: 1}
    home_motion: {velocity_scale: 0.1, timeout_s: 2.0}
    trajectory:
      # lead_speed_scale: 1.5
      lead_speed_scale: 5.0
      # Velocity cap only: acceleration/deceleration/jerk 0 = unlimited; teleop publishes the mapped target directly.
      # position: {velocity: 2.0, acceleration: 20.0, deceleration: 20.0, reversal_deceleration: 40.0, jerk: 200.0}
      # orientation: {velocity: 5.0, acceleration: 10.0, deceleration: 10.0, reversal_deceleration: 20.0, jerk: 100.0}
      position: {velocity: 2.0}
      orientation: {velocity: 5.0}
  right_arm_pose:
    type: frame_target
    frame: right_base_link
    joints: [r_arm_joint1, r_arm_joint2, r_arm_joint3, r_arm_joint4, r_arm_joint5, r_arm_joint6, r_arm_joint7]
    # joints: [torso_joint1, torso_joint2, r_arm_joint1, r_arm_joint2, r_arm_joint3, r_arm_joint4, r_arm_joint5, r_arm_joint6, r_arm_joint7]  # arms share the waist
    reference: chassis_base_link
    weight: 5
    orientation_weight: [0.2, 0.2, 0.2]
    lm_damping: 0.1
    task: {level: 1}
    home_motion: {velocity_scale: 0.1, timeout_s: 2.0}
    trajectory:
      # lead_speed_scale: 1.5
      lead_speed_scale: 5.0
      # Velocity cap only: acceleration/deceleration/jerk 0 = unlimited; teleop publishes the mapped target directly.
      # position: {velocity: 2.0, acceleration: 20.0, deceleration: 20.0, reversal_deceleration: 40.0, jerk: 200.0}
      # orientation: {velocity: 5.0, acceleration: 10.0, deceleration: 10.0, reversal_deceleration: 20.0, jerk: 100.0}
      position: {velocity: 2.0}
      orientation: {velocity: 5.0}
  left_arm_null:
    type: null_space
    primary: left_arm_pose
    # posture/initial pulled the stretched elbow at handover back and forth against the joint4 limit
    preference: manipulability
    manipulability_rate: 1.0
    manipulability_weight: 0.1
    task: {level: 1}
  right_arm_null:
    type: null_space
    primary: right_arm_pose
    # posture/initial pulled the stretched elbow at handover back and forth against the joint4 limit
    preference: manipulability
    manipulability_rate: 1.0
    manipulability_weight: 0.1
    task: {level: 1}
  torso_joint:
    type: joint_target
    joints: [torso_joint1, torso_joint2]
    home_motion: {velocity_scale: 0.1667, timeout_s: 2.0}
    on_idle: claim
    release_after_s: 0.25
  left_arm_joint:
    type: joint_target
    joints: [l_arm_joint1, l_arm_joint2, l_arm_joint3, l_arm_joint4, l_arm_joint5, l_arm_joint6, l_arm_joint7]
    home_motion: {velocity_scale: 0.1667, timeout_s: 2.0}
    on_idle: claim
    release_after_s: 0.25
    task: {level: 1}
  right_arm_joint:
    type: joint_target
    joints: [r_arm_joint1, r_arm_joint2, r_arm_joint3, r_arm_joint4, r_arm_joint5, r_arm_joint6, r_arm_joint7]
    home_motion: {velocity_scale: 0.1667, timeout_s: 2.0}
    on_idle: claim
    release_after_s: 0.25
    task: {level: 1}
  left_hand_joint:
    type: joint_target
    joints: [left_thumb_metacarpal_joint, left_thumb_proximal_joint, left_index_proximal_joint, left_middle_proximal_joint, left_ring_proximal_joint, left_pinky_proximal_joint]
    on_idle: claim
    release_after_s: 0.25
    trajectory: {trigger: direct}  # fingers follow the target without shaping
    task: {level: 1}
  right_hand_joint:
    type: joint_target
    joints: [right_thumb_metacarpal_joint, right_thumb_proximal_joint, right_index_proximal_joint, right_middle_proximal_joint, right_ring_proximal_joint, right_pinky_proximal_joint]
    on_idle: claim
    release_after_s: 0.25
    trajectory: {trigger: direct}  # fingers follow the target without shaping
    task: {level: 1}
  head_joint:
    type: joint_target
    joints: [head_joint1, head_joint2]
    home_motion: {velocity_scale: 0.1667, timeout_s: 2.0}
    on_idle: claim
    release_after_s: 0.25
  gaze:
    type: gaze
    frame: head_link2
    joints: [head_joint1, head_joint2]
    frames: [left_base_link, right_base_link]
    max_velocity: 0.5
    target_idle_s: 5.0
  # waist is z-lift + pitch only, cannot shift the CoM in XY
  # com:
  #   type: center_of_mass
  #   frame: chassis_base_link
  #   # drive wheels and caster contacts
  #   polygon: [[0.1805, 0.1785], [0.0, 0.2275], [-0.235, 0.0], [0.0, -0.2275], [0.1805, -0.1785]]
  #   # margin: 0.02
  #   margin: 0.05
  #   recovery_tasks: [torso_pose]
  #   closed_loop: false
  #   payloads:
  #     - {frame: left_base_link, mass: 3.0}
  #     - {frame: right_base_link, mass: 3.0}
  self_collision:
    type: self_collision
    urdf: ${urdf}
    groups:
      - {name: left_arm, joint_prefixes: [l_, left_]}
      - {name: right_arm, joint_prefixes: [r_, right_]}
    exclude_pairs:
      - [head_base_link_0, head_link2_0]
      - [torso_link2_0, head_link2_0]
      - [l_arm_base_link_0, l_arm_link2_0]
      - [r_arm_base_link_0, r_arm_link2_0]
      - [l_flange_0, l_arm_link5_0]
      - [r_flange_0, r_arm_link5_0]
      - [l_arm_link5_0, l_arm_link7_0]
      - [r_arm_link5_0, r_arm_link7_0]
      - [left_base_link_0, left_thumb_proximal_link_0]
      - [right_base_link_0, right_thumb_proximal_link_0]
    # the two hands (palm, fingers, flange) never collide-check each other
    exclude_subtrees:
      - [left_base_link, right_base_link]
    closed_loop: false
    # constraint: {clearance: 0.002, activation_margin: 0.02, hysteresis: 0.005, gain: 1.5}
    constraint: {clearance: 0.01, activation_margin: 0.01, hysteresis: 0.005, gain: 1.5, approach_deceleration: 20}
