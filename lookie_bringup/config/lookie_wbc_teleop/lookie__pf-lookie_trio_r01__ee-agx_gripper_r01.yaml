# lookie_wbc_teleop overrides for lookie__pf-lookie_trio_r01__ee-agx_gripper_r01 (loaded after common.yaml).
# omni chassis: headset drives chassis pose and waist z/pitch/yaw.
/**/lookie_wbc_teleop:
  ros__parameters:
    body_axes: [chassis, waist_z, waist_pitch, waist_yaw]

    # Parallel gripper: joint value is the opening width in m (0 closed, 0.1 fully open); main trigger 0 -> ee_open, 1 -> ee_close.
    ee_modules: [left_gripper_joint, right_gripper_joint]
    trigger_deadzone: 0.05
    ee_open: [0.1]
    ee_close: [0.0]
