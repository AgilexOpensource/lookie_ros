# Chassis velocity arbitration in front of kstone's chassis velocity port.
#
# Every source publishes Twist on its own topic; twist_mux forwards the highest-priority live one, so a
# source that stops publishing hands the chassis back instead of holding it. Add a source by adding an
# entry; priorities are only compared while a source is live (has published within its timeout).
/**/twist_mux:
  ros__parameters:
    topics:
      teleop:
        topic: lookie_teleop/cmd_vel
        # s without a message before this source is considered gone. Keep it short: while it lasts the mux
        # repeats the last command, and kstone adds its own 0.25 s lease on top, so a dead source keeps the
        # base moving for timeout + 0.25 s.
        timeout: 0.15
        priority: 100
